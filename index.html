<!DOCTYPE html>
<!-- Indica que es HTML5. Siempre primera línea. -->
 
<html lang='es'>
<!-- Elemento raíz. lang='es' ayuda a lectores de pantalla y buscadores. -->
 
  <head>
  <!-- Metadatos: el navegador los necesita pero no los muestra al usuario -->
 
    <meta charset='UTF-8'>
    <!-- Codificación de caracteres: soporta tildes, ñ, emojis -->
 
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <!-- Sin esto, en celular la página se ve muy pequeña -->
 
    <title>TechStore - Tu tienda de tecnología</title>
    <!-- Aparece en la pestaña del navegador y en Google -->
 
    <link rel='stylesheet' href='estilos.css'>
    <!-- Vincula el archivo CSS. El path es relativo al index.html -->
    <!-- estilos.css debe estar en la misma carpeta que index.html -->
  </head>
 
  <body>
  <!-- Todo lo visible va acá -->
   <header>
    <h1>TechStore</h1>
    <nav>
      <ul id="Menu">
        <li><a href="#productos">Catálogo</a></li>
        <li><a href="#Ofertas">Ofertas</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
    </nav>
   </header>

   <main>
    <div>
      <h2>Catálogo de productos</h2>
    </div>

          <!-- Buscador por nombre -->
      <div class="campo-busqueda">
        <input type="text" id="buscador" placeholder="Buscar por nombre o marca...">
        <button id="btn-limpiar-busqueda" class="btn-limpiar">✕</button>
      </div>

      <!-- Botones de categoría -->
      <div id="botones-filtro">
        <button class="btn-filtro activo" data-categoria="todos">Todos</button>
        <button class="btn-filtro" data-categoria="notebook">Notebooks</button>
        <button class="btn-filtro" data-categoria="celular">Celulares</button>
        <button class="btn-filtro" data-categoria="auricular">Auriculares</button>
        <button class="btn-filtro" data-categoria="monitor">Monitores</button>
        <button class="btn-filtro" data-categoria="pc_escritorio">PCs</button>
        <button id="btn-limpiar-filtros" class="btn-limpiar-filtros">✕ Limpiar filtros</button>
      </div>


    <section id="productos"></section>
  

    <section id="ofertas">
      <h2>Ofertas y Novedades</h2>
      <ol>
        <li>Rebajas de temporada</li>
        <li>Productos usados</li>
        <li>Nuevos productos</li>
      </ol>
    </section>
   </main>

   <footer>
    <h6>Lucio Reinaudi 2026</h6>
   </footer>
    
    <script src='js/app.js'></script>
    
    <!-- JS SIEMPRE al final del body, antes de la etiqueta de cierre -->
    <!-- Si va en el head, el script corre antes de que exista el HTML -->
    <!-- y document.getElementById('productos') devuelve null -->
  </body>
 
</html>
